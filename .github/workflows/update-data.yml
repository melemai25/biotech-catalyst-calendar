name: Refresh catalyst data

on:
  schedule:
    - cron: '0 11 * * *'   # daily at 11:00 UTC
  workflow_dispatch:        # lets you trigger it by hand
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch ClinicalTrials.gov data and build events.json
        run: npm run build

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/events.json
          git diff --staged --quiet || git commit -m "chore: refresh catalyst data"
          git push
        continue-on-error: true

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
