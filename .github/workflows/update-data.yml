name: Refresh data and deploy

on:
  schedule:
    - cron: '14 11 * * *'    # daily, 11:14 UTC
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    branches: [main]
    # front-end only changes go through deploy-ui instead
    paths-ignore:
      - 'public/index.html'
      - 'public/styles.css'
      - 'public/app.js'
      - 'public/support.js'
      - 'public/data/notice.json'
      - '**.md'
      - '.gitignore'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # SEC requires a contact string
      EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
      # for canonical tags and sitemap.xml, defaults to the Pages url
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # push = code change: rebuild pages from the data already in the repo, no fetch, no commit.
      # schedule/manual = full refresh
      - name: Check SEC contact string
        if: github.event_name != 'push'
        run: |
          if [ -z "$EDGAR_USER_AGENT" ]; then
            echo "::warning::EDGAR_USER_AGENT is not set. SEC filings and financial"
            echo "::warning::metrics will be skipped. Add it under Settings ->"
            echo "::warning::Secrets and variables -> Actions -> Variables."
          else
            echo "SEC contact string is set."
          fi

      - name: Fetch trials, filings and financials
        if: github.event_name != 'push'
        run: node scripts/build-data.js

      - name: Generate static pages and sitemap
        run: node scripts/build-pages.js --base "$SITE_BASE_URL"

      - name: Commit refreshed data and pages
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # don't add macro.json, that belongs to the macro workflow
          git add public/data/index.json public/data/events.json public/data/ticker \
                  public/ticker public/calendar public/economic-calendar \
                  public/sitemap.xml public/robots.txt
          git diff --staged --quiet && echo "No change." && exit 0
          git commit -m "chore: refresh data and pages"
          # macro workflow pushes here too, so rebase and retry instead of force
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing onto origin/${GITHUB_REF_NAME} (attempt $i)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
        continue-on-error: true

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
