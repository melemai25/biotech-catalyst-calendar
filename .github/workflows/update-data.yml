name: Refresh data and deploy

on:
  schedule:
    - cron: '14 11 * * *'    # daily, 11:14 UTC
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # The SEC rejects unidentified requests. Set this at
      # Settings -> Secrets and variables -> Actions -> Variables.
      EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT }}
      # Used for canonical tags and sitemap.xml. Defaults to the Pages URL.
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A push is someone changing the code. The data did not change, so there
      # is nothing to refetch — and refetching anyway meant every push kicked
      # off a six-minute job that committed data back to main, which is what
      # kept rejecting the next push with "fetch first".
      #
      # On push: regenerate the pages from the data already in the repo and
      # deploy. A few seconds, no commit, nothing to race against.
      # On schedule or manual dispatch: the full refresh, as before.
      - name: Check SEC contact string
        if: github.event_name != 'push'
        run: |
          if [ -z "$EDGAR_USER_AGENT" ]; then
            echo "::warning::EDGAR_USER_AGENT is not set. SEC filings and financial"
            echo "::warning::metrics will be skipped. Add it under Settings ->"
            echo "::warning::Secrets and variables -> Actions -> Variables."
          else
            echo "SEC contact string is set."
          fi

      - name: Fetch trials, filings and financials
        if: github.event_name != 'push'
        run: node scripts/build-data.js

      - name: Generate static pages and sitemap
        run: node scripts/build-pages.js --base "$SITE_BASE_URL"

      - name: Commit refreshed data and pages
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # macro.json belongs to the macro workflow. Adding the whole data
          # directory would let this job revert a fresher macro payload.
          git add public/data/index.json public/data/events.json public/data/ticker \
                  public/ticker public/calendar public/economic-calendar \
                  public/sitemap.xml public/robots.txt
          git diff --staged --quiet && echo "No change." && exit 0
          git commit -m "chore: refresh data and pages"
          # The macro workflow pushes to this branch too, so a plain push loses
          # the race often enough to matter. Rebase and retry rather than force.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing onto origin/${GITHUB_REF_NAME} (attempt $i)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
        continue-on-error: true

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
