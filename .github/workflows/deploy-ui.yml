name: Deploy UI

# Quick deploy for front-end changes. Publishes public/ as-is: no fetching,
# no building, no commit. Changes to build-pages.js still need the full workflow.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      # skip generated files, otherwise the daily data commit triggers this too
      - '!public/data/**'
      - '!public/ticker/**'
      - '!public/calendar/**'
      - '!public/catalyst-calendar/**'
      - '!public/economic-calendar/**'
      - '!public/sitemap.xml'
      - '!public/robots.txt'
      # hand-edited, so include it
      - 'public/data/notice.json'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read          # nothing is committed, so read is enough

# Pages only takes one deploy at a time, queue instead of collide
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # a syntax error in app.js just shows a blank page, catch it here
      - name: Check the scripts parse
        run: |
          fail=0
          for f in public/app.js public/support.js; do
            if [ -f "$f" ]; then
              if node --check "$f"; then
                echo "ok   $f"
              else
                echo "::error file=$f::$f has a syntax error and would break the page"
                fail=1
              fi
            fi
          done
          exit $fail

      # warn on bad notice.json
      - name: Check notice.json is valid
        run: |
          if [ -f public/data/notice.json ]; then
            node -e "
              const n = require('./public/data/notice.json');
              if (n.message && !n.until) {
                console.log('::warning::notice.json has a message but no \"until\" date, so it will never be shown.');
              }
              console.log('notice.json parses.');
            "
          fi

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
