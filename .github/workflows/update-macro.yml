name: Refresh macro data

# Macro data refresh, separate from the daily biotech build.
# Cron is UTC, these clear the releases in both EST and EDT:
#   13:45 UTC  after the 08:30 ET releases (CPI, jobs, GDP...)
#   15:20 UTC  after the 10:00 ET releases (JOLTS, sentiment, ISM)
#   22:30 UTC  after the close (cross-asset, Friday COT)
# GitHub's scheduler can run a few minutes late.

on:
  schedule:
    - cron: '45 13 * * 1-5'
    - cron: '20 15 * * 1-5'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# same Pages group as the data workflow so they don't deploy over each other
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  macro:
    runs-on: ubuntu-latest
    env:
      # free key: https://fredaccount.stlouisfed.org/apikeys
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check FRED key
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::FRED_API_KEY is not set, so the macro page cannot be built."
            echo "::error::Get a free key at https://fredaccount.stlouisfed.org/apikeys"
            echo "::error::then add it under Settings -> Secrets and variables ->"
            echo "::error::Actions -> Secrets -> New repository secret."
            exit 1
          fi

      - name: Build macro data
        run: node scripts/build-macro.js

      # only commit the econ calendar page, the other pages belong to the data workflow
      - name: Regenerate the economic calendar page
        run: node scripts/build-pages.js --base "$SITE_BASE_URL"
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

      - name: Commit refreshed macro data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/macro.json public/economic-calendar public/sitemap.xml
          git diff --staged --quiet && echo "No change." && exit 0
          git commit -m "chore: refresh macro data"
          # both workflows push here, rebase and retry instead of force
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing onto origin/main (attempt $i)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "::error::Could not push after 3 attempts."
          exit 1

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
