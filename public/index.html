<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>Biolyst — Biotech Catalysts and Analysis</title>
<meta name="description" content="Track clinical trial readouts, FDA decisions and earnings dates across the biotech sector, alongside the US economic calendar. Free, no login." />
<!-- The watchlist lives at /?tickers=... Every combination is the same page,
     so all of them consolidate back to the clean URL rather than competing. -->
<link rel="canonical" href="/" />

<!-- SVG first for browsers that take it (stays sharp at any size), PNG as the
     fallback. apple-touch-icon is what iOS uses for a home-screen shortcut. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#0E8C97" />

<meta property="og:title" content="Biolyst — Biotech Catalysts and Analysis" />
<meta property="og:description" content="Clinical trial readouts, FDA decisions and earnings dates across the biotech sector. Free, no login." />
<meta property="og:type" content="website" />
<meta property="og:image" content="icon-512.png" />
<meta name="twitter:card" content="summary" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=17">

<style>
  /* Small enough to live here rather than in styles.css, and it keeps this
     footer working even if the stylesheet fails to load — which matters,
     because these are the only links a crawler can follow from this page. */
  .home-links{
    max-width:1180px;margin:0 auto 26px;padding:0 20px;
    display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
    font-size:13px;
  }
  .home-links a{color:#5A7784;text-decoration:none;}
  .home-links a:hover{color:#0A6E77;text-decoration:underline;}
</style>
</head>
<body>
<div id="root"><div class="loading">Loading…</div></div>

<!--
  Static links to the generated pages.

  The app renders into #root and replaces everything inside it, so every link
  the app draws is invisible to a crawler that does not execute JavaScript.
  Without these, /catalyst-calendar/, the ticker pages and the month pages are
  reachable only through sitemap.xml — which Google treats as a suggestion
  rather than a route, and ranks accordingly.

  They sit outside #root so a re-render never removes them.
-->
<nav class="home-links">
  <a href="catalyst-calendar/">Biotech catalyst calendar</a>
  <a href="economic-calendar/">US economic calendar</a>
</nav>

<script src="app.js?v=17"></script>
<script src="support.js?v=1"></script>
</body>
</html>
