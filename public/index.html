<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>Biolyst — Biotech Catalysts and Analysis</title>
<meta name="description" content="Track clinical trial readouts, FDA decisions and earnings dates across the biotech sector, alongside the US economic calendar. Free, no login." />
<!-- The watchlist lives at /?tickers=... Every combination is the same page,
     so all of them consolidate back to the clean URL rather than competing. -->
<link rel="canonical" href="/" />

<!-- SVG first for browsers that take it (stays sharp at any size), PNG as the
     fallback. apple-touch-icon is what iOS uses for a home-screen shortcut. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#0E8C97" />

<meta property="og:title" content="Biolyst — Biotech Catalysts and Analysis" />
<meta property="og:description" content="Clinical trial readouts, FDA decisions and earnings dates across the biotech sector. Free, no login." />
<meta property="og:type" content="website" />
<meta property="og:image" content="icon-512.png" />
<meta name="twitter:card" content="summary" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=17">

<style>
  /* Matches the nav on the generated pages, so moving between the app and the
     calendars feels like one site. Kept here rather than in styles.css because
     it must survive the stylesheet failing to load — these are the only links
     a crawler can follow out of this page.

     No brand link: the masthead immediately below already says Biolyst, and
     saying it twice in 60px of vertical space reads as a mistake. */
  .site-nav{
    max-width:1180px;margin:0 auto;padding:14px 20px 0;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:13px;
  }
  .site-nav a{color:#5A7784;text-decoration:none;}
  .site-nav a:hover{color:#0A6E77;}
  .site-nav-here{color:#0E8C97;font-weight:600;}
  /* app.js moves the build-date pill in here once the data loads. */
  .site-nav .masthead-right{margin-left:auto;}

  .site-brand{
    display:flex;align-items:center;gap:9px;
    margin:0 6px 0 0;font-size:19px;font-weight:800;letter-spacing:-.025em;
    color:#16343F;line-height:1;
  }
  .site-brand-word{white-space:nowrap;}
  .site-brand .accent{color:#0E8C97;}
  .site-brand-mark{display:block;width:26px;height:26px;flex:0 0 auto;}
  .site-brand-mark svg{display:block;width:100%;height:100%;border-radius:7px;}
</style>
</head>
<body>

<!--
  Static links to the generated pages, above the app rather than below it.

  The app renders into #root and replaces everything inside it, so every link
  the app draws is invisible to a crawler that does not execute JavaScript.
  Without these, /catalyst-calendar/, the ticker pages and the month pages are
  reachable only through sitemap.xml — which Google treats as a suggestion
  rather than a route, and ranks accordingly.

  Outside #root, so a re-render never removes them.
-->
<nav class="site-nav" aria-label="Site">
  <!--
    The brand lives here, in static HTML, rather than being drawn by app.js.
    Two reasons: it frees the middle of the masthead row for the notice, and it
    gives this page an <h1> that a crawler can see. Everything app.js renders
    is inside #root and invisible without JavaScript.
  -->
  <h1 class="site-brand">
    <span class="site-brand-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="11" fill="#0E8C97"/>
        <path d="M9 25h7.5l4-11 5.5 22 4.5-13h8.5" fill="none" stroke="#fff"
              stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <!-- One span, not bare text plus a span: .site-brand is a flex container,
         so each would become its own flex item and the 9px gap would open up
         in the middle of the word. -->
    <span class="site-brand-word">Bio<span class="accent">lyst</span></span>
  </h1>
  <span class="site-nav-here" aria-current="page">Tracker</span>
  <a href="catalyst-calendar/">Catalyst calendar</a>
  <a href="economic-calendar/">Economic calendar</a>
</nav>

<div id="root"><div class="loading">Loading…</div></div>

<script src="app.js?v=17"></script>
<script src="support.js?v=1"></script>
</body>
</html>
